plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'io.freefair.lombok' version '8.6'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    
    maven {
        name = "Aliyun"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "AliyunForge"
        url = "https://maven.aliyun.com/repository/forge"
    }
    maven {
        name = "Tencent"
        url = "https://mirrors.tencent.com/nexus/repository/maven-public/"
    }
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
    }
    
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    
    mavenCentral()
    mavenLocal()
}

dependencies {
    
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "io.netty:netty-handler-proxy:${"4.1.111.Final"}"
    include "io.netty:netty-handler-proxy:${"4.1.111.Final"}"
    implementation "io.netty:netty-codec-socks:${"4.1.111.Final"}"
    include "io.netty:netty-codec-socks:${"4.1.111.Final"}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    
    
    
    
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    
    
    
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}


publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    
    repositories {
        
        
        
        
    }
}
