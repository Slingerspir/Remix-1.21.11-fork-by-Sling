name: Gradle Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      skipTests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false
      releaseTag:
        description: 'Release tag (for manual trigger)'
        required: false
        type: string
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      with:
        gradle-version: '9.5.0'

    - name: Build with Gradle
      run: |
        if [ "${{ github.event.inputs.skipTests }}" == "true" ]; then
          gradle build -x test --no-daemon
        else
          gradle build --no-daemon
        fi

    - name: Publish to GitHub Packages
      run: gradle publish --no-daemon
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 列出 build/libs 目录内容（调试用）
    - name: List build/libs contents
      run: |
        echo "=== Files in build/libs ==="
        ls -la build/libs/ || echo "build/libs directory not found or empty"

    # 上传构建产物到 Release
    - name: Upload artifacts to Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      with:
        files: |
          build/libs/*.jar
        fail_on_unmatched_files: false
        tag_name: ${{ github.event.release.tag_name || github.event.inputs.releaseTag || github.ref_name }}
        generate_release_notes: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
